<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 Merge challenge</title>
<meta name="description" content="A friend challenged you to beat their score on the same 2048 board.">
<meta property="og:title" content="Beat my score in 2048 Merge">
<meta property="og:description" content="Same board, same tiles. Can you score higher?">
<style>
  :root { --bg: #141634; --panel: #1E2150; --cell: #2E3378; --ink: #F6F1E7; --muted: #A9ACD6; --accent: #F2C230; --accent-ink: #1B1D3A; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
         font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); text-align: center; }
  main { width: 100%; max-width: 420px; background: var(--panel); border-radius: 20px; padding: 28px 20px; border: 1px solid rgba(255,255,255,.12); }
  .tiles { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
  .tiles span { width: 52px; height: 52px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .score { background: var(--cell); border-radius: 14px; padding: 14px; margin-bottom: 20px; }
  .score small { display: block; color: var(--muted); font-weight: 700; letter-spacing: .08em; font-size: 12px; }
  .score b { font-size: 36px; }
  a.btn { display: block; padding: 14px; border-radius: 14px; font-weight: 700; text-decoration: none; margin-top: 10px; }
  .primary { background: var(--accent); color: var(--accent-ink); }
  .alt { background: var(--cell); color: var(--ink); }
  .note { color: var(--muted); font-size: 13px; margin-top: 18px; }
  .note a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="tiles" aria-hidden="true">
    <span style="background:#F3EFE6;color:#1B1D3A">2</span>
    <span style="background:#F2C230;color:#1B1D3A">8</span>
    <span style="background:#C2185B;color:#FFF8EC">64</span>
    <span style="background:#D4A017;color:#1B1D3A;font-size:15px">2048</span>
  </div>
  <h1 id="title">You've been challenged!</h1>
  <p class="sub" id="sub">Play the exact same board and beat your friend's score.</p>
  <div class="score" id="scoreBox" hidden><small>SCORE TO BEAT</small><b id="score"></b></div>
  <a class="btn primary" id="open" href="#">Play this board</a>
  <a class="btn alt" id="get" href="https://play.google.com/store/apps/details?id=com.anbuapp.play2048merge">Get 2048 Merge on Google Play</a>
  <p class="note">Free on Android. <a href="../">About the game</a> · <a href="../privacy.html">Privacy</a></p>
</main>
<script>
  (function () {
    var PKG = 'com.anbuapp.play2048merge';
    var STORE = 'https://play.google.com/store/apps/details?id=' + PKG;
    var q = new URLSearchParams(location.search);
    var seed = parseInt(q.get('seed'), 10);
    var n = parseInt(q.get('n'), 10);
    var s = parseInt(q.get('s'), 10);
    var valid = !isNaN(seed) && n >= 4 && n <= 6;

    if (valid) {
      document.getElementById('sub').textContent = 'Same ' + n + '×' + n + ' board, same tiles. Can you score higher?';
      if (s > 0) {
        document.getElementById('score').textContent = s.toLocaleString('en');
        document.getElementById('scoreBox').hidden = false;
      }
    }

    var open = document.getElementById('open');
    var android = /Android/i.test(navigator.userAgent);
    if (valid && android) {
      // Opens the app when installed; otherwise Chrome falls back to the Play Store.
      var path = 'anbushan.github.io/play2048merge/c?seed=' + seed + '&n=' + n + '&s=' + (s > 0 ? s : 0);
      open.href = 'intent://' + path + '#Intent;scheme=https;package=' + PKG +
        ';S.browser_fallback_url=' + encodeURIComponent(STORE) + ';end';
    } else {
      open.href = STORE;
      open.textContent = valid ? 'Get the app to play this board' : 'Play 2048 Merge';
      document.getElementById('get').hidden = true;
    }
  })();
</script>
</body>
</html>
